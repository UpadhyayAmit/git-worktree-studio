<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Trunk 1 (left) -->
  <line x1="20" y1="90" x2="20" y2="20" stroke="#4EC9B0" stroke-width="4" stroke-linecap="round"/>
  <!-- Branches from Trunk 1 -->
  <line x1="20" y1="70" x2="5" y2="55" stroke="#4EC9B0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="50" x2="35" y2="35" stroke="#4EC9B0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="5" cy="55" r="3" fill="#4EC9B0"/>
  <circle cx="35" cy="35" r="3" fill="#4EC9B0"/>

  <!-- Trunk 2 (center) -->
  <line x1="50" y1="90" x2="50" y2="15" stroke="#569CD6" stroke-width="4" stroke-linecap="round"/>
  <!-- Branches from Trunk 2 -->
  <line x1="50" y1="72" x2="35" y2="57" stroke="#569CD6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="65" y2="37" stroke="#569CD6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="38" y2="20" stroke="#569CD6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="35" cy="57" r="3" fill="#569CD6"/>
  <circle cx="65" cy="37" r="3" fill="#569CD6"/>
  <circle cx="38" cy="20" r="3" fill="#569CD6"/>

  <!-- Trunk 3 (right) -->
  <line x1="80" y1="90" x2="80" y2="20" stroke="#CE9178" stroke-width="4" stroke-linecap="round"/>
  <!-- Branches from Trunk 3 -->
  <line x1="80" y1="65" x2="95" y2="50" stroke="#CE9178" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="42" x2="65" y2="28" stroke="#CE9178" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="95" cy="50" r="3" fill="#CE9178"/>
  <circle cx="65" cy="28" r="3" fill="#CE9178"/>
</svg>
